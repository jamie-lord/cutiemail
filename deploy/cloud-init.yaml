#cloud-config
# Hetzner user-data: prepare a bare Ubuntu box to run the mail server.
# Installs Node 22 (the only runtime requirement — no npm install, the server is
# just the src/ tree), creates the service account and data dir, and opens the
# firewall for SSH + the three mail ports. hetzner-up.sh then rsyncs the code,
# writes the unit with your real config, and starts it.
package_update: true
packages:
  - curl
  - rsync
  - ufw
  # POSIX ACLs: the updater is granted read on the mail databases through a default ACL, which is
  # what lets it snapshot them without the daemon having to widen its own 0600 umask.
  - acl
  # for the doc's "is outbound port 25 open?" check (nc gmail-smtp-in.l.google.com 25)
  - netcat-openbsd

users:
  - default          # keep the platform-injected SSH key on root
  - name: mail
    system: true
    # `homedir`, not `home`: cloud-init's users schema has no `home` property, so this whole
    # cloud-config failed schema validation and cloud-init finished "degraded". It still created
    # the user and ran everything, which is why the fault was invisible — until `cloud-init status`
    # started returning exit 2 and hung the provisioning script that reads it.
    homedir: /opt/mailserver
    shell: /usr/sbin/nologin

runcmd:
  # Node 22 (>= 22.18 runs the TypeScript directly, and node:sqlite is built in).
  - curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
  - apt-get install -y nodejs
  - mkdir -p /opt/mailserver /var/lib/mailserver
  - chown -R mail:mail /opt/mailserver /var/lib/mailserver
  # Only the ports we serve. Inbound 25 = receiving; 587/993 = your own client.
  - ufw allow 22/tcp
  - ufw allow 25/tcp
  - ufw allow 587/tcp
  - ufw allow 993/tcp
  - ufw --force enable
